<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSSSMC Admin Login</title>
    <style>
      :root {
        --bg: #f4f7f1;
        --panel: #ffffff;
        --green: #1d8f4d;
        --green-dark: #0f5f35;
        --text: #1e2a27;
        --muted: #5c6b66;
        --line: #dfe9e2;
        --danger: #a12b2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #edf7f0, #f8faf8);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .login-card {
        width: min(460px, 92vw);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 26px;
        box-shadow: 0 18px 40px rgba(17, 37, 25, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        color: var(--green-dark);
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 1rem;
        margin-bottom: 18px;
      }
      input:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(29, 143, 77, 0.12);
      }
      button {
        width: 100%;
        border: none;
        background: linear-gradient(135deg, var(--green), var(--green-dark));
        color: white;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .note {
        margin-top: 18px;
        text-align: center;
        font-size: 0.92rem;
      }
      .error {
        background: #fff0f0;
        color: var(--danger);
        border: 1px solid #f1c4c4;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-weight: 700;
      }
      .success {
        background: #edf9f1;
        color: var(--green-dark);
        border: 1px solid #cfe6d6;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-weight: 700;
      }
      a {
        color: var(--green-dark);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Admin Login</h1>
      <p>Sign in to manage mosque membership and donations.</p>

      {% if registered %}
      <div class="success">
        Admin account created successfully. Please sign in.
      </div>
      {% endif %} {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Login</button>
      </form>

      <div class="note" style="color: #5c6b66">Private access only</div>
    </div>
  </body>
</html>
