<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --panel: #ffffff;
        --green: #1d8f4d;
        --green-dark: #0f5f35;
        --text: #1c2a28;
        --muted: #5d6d68;
        --line: #dfeae4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .topbar {
        background: linear-gradient(135deg, var(--green), var(--green-dark));
        color: white;
        padding: 18px 0;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px 18px 60px;
      }
      .topbar-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.2rem);
      }
      .logout {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
      .profile-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(16, 36, 27, 0.06);
        padding: 32px 24px;
        margin-top: 28px;
      }
      .label {
        display: block;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.8rem;
        margin-bottom: 6px;
      }
      .value {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 22px;
      }
      .actions {
        margin-top: 10px;
      }
      .link-btn {
        display: inline-block;
        background: var(--green-dark);
        color: white;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <h1>My Profile</h1>
        <a class="logout" href="/account/logout">Logout</a>
      </div>
    </div>

    <div class="container">
      <div class="profile-card">
        <div class="label">Full Name</div>
        <div class="value" id="full-name">Loading...</div>

        <div class="label">Username</div>
        <div class="value" id="username">Loading...</div>

        <div class="label">Email</div>
        <div class="value" id="email">Loading...</div>

        <div class="actions">
          <a class="link-btn" href="/">Back to Home</a>
        </div>
      </div>
    </div>

    <script>
      const user = {
        fullName: "User",
        username: "user",
        email: "user@example.com",
      };

      const fullNameEl = document.getElementById("full-name");
      const usernameEl = document.getElementById("username");
      const emailEl = document.getElementById("email");

      fullNameEl.textContent = user.fullName;
      usernameEl.textContent = user.username;
      emailEl.textContent = user.email;
    </script>
  </body>
</html>
